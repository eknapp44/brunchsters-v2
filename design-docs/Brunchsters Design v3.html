    html, body, #root { height: 100%; margin: 0; }
    body { background: #f3eee7; }
    .ab-frame { width: 100%; height: 100%; overflow: hidden; contain: paint; }
    .ab-frame .bs-app { min-height: 100%; }

    /* ─────────────────────────────────────────────────────────────
       Tablecloth — applied INSIDE each .ab-frame (each app page) so
       the UI sits on top of a real linen-with-stains surface.
       The design-canvas backdrop returns to a calm neutral.
       Cards, topbars, inputs etc keep their opaque `--surface` so
       they read as plates / placemats on the cloth.
       ───────────────────────────────────────────────────────────── */
    .ab-frame.has-tablecloth { position: relative; }
    .ab-frame.has-tablecloth .bs-app { background: transparent !important; }
    .ab-frame.has-tablecloth::before,
    .ab-frame.has-tablecloth::after {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    }
    /* Base linen + weave + creases */
    .ab-frame.has-tablecloth::before {
      background-color: #f1ece4;
      background-image:
        /* linen weave — tight cross-hatch, very subtle */
        repeating-linear-gradient( 90deg, rgba(155,135,105,0.04) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(  0deg, rgba(155,135,105,0.035) 0 1px, transparent 1px 3px),
        /* slightly looser broken twill, slow diagonal */
        repeating-linear-gradient( 45deg, rgba(125,100,75,0.022) 0 2px, transparent 2px 9px),
        /* long, soft creases */
        linear-gradient(118deg, transparent 0 38%, rgba(120,95,70,0.045) 39% 40%, transparent 41% 100%),
        linear-gradient(74deg,  transparent 0 62%, rgba(120,95,70,0.04)  63% 64%, transparent 65% 100%),
        /* huge, slow vignette so the cloth looks gathered, not flat */
        radial-gradient(120% 90% at 30% 25%, rgba(255,247,232,0.55) 0%, transparent 55%),
        radial-gradient(110% 80% at 80% 80%, rgba(180,150,115,0.10) 0%, transparent 60%);
      background-size:
        3px 3px,
        3px 3px,
        12px 12px,
        100% 100%,
        100% 100%,
        100% 100%,
        100% 100%;
    }

    /* Per-intensity opacity on the stains layer */
    .ab-frame.has-tablecloth.t-subtle::after { opacity: 0.55; }
    .ab-frame.has-tablecloth.t-medium::after { opacity: 0.85; filter: saturate(1.05); }
    .ab-frame.has-tablecloth.t-full::after   { opacity: 1.0;  filter: saturate(1.15) contrast(1.06); }

    /* Cards / surfaces sit above the cloth — bump shadow so they look like
       real plates / placemats catching light on the tablecloth. */
    .ab-frame.has-tablecloth .bs-card { box-shadow: 0 1px 2px rgba(60,40,20,0.06), 0 12px 28px -14px rgba(60,40,20,0.18); }
    .ab-frame.has-tablecloth .bs-topbar { background: rgba(255,251,243,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-bottom-color: rgba(120,95,70,0.10); }

    /* Ensure app content stacks above the cloth pseudo-elements */
    .ab-frame.has-tablecloth > * { position: relative; z-index: 1; }

    /* ---- Font-pair overrides (live-switchable via Tweaks) ----
       Each pair retunes --font-sans / --font-display + a couple of
       per-pair tracking tweaks so headings sit right. */
    .ab-frame[data-fontpair="soft"] {
      --font-sans: "Nunito", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Fraunces", "Nunito", Georgia, serif;
      font-variation-settings: "SOFT" 100;
    }
    .ab-frame[data-fontpair="soft"] .bs-h1,
    .ab-frame[data-fontpair="soft"] .bs-wordmark {
      font-variation-settings: "SOFT" 100, "opsz" 144;
      letter-spacing: -0.018em;
    }

    .ab-frame[data-fontpair="friendly"] {
      --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      --font-display: "DM Serif Display", "DM Sans", Georgia, serif;
    }
    .ab-frame[data-fontpair="friendly"] .bs-h1,
    .ab-frame[data-fontpair="friendly"] .bs-wordmark,
    .ab-frame[data-fontpair="friendly"] .bs-h2 {
      font-weight: 400;
      letter-spacing: -0.025em;
    }

    .ab-frame[data-fontpair="playful"] {
      --font-sans: "Quicksand", ui-sans-serif, system-ui, sans-serif;
      --font-display: "Lora", "Quicksand", Georgia, serif;
    }
    .ab-frame[data-fontpair="playful"] .bs-wordmark {
      font-style: italic;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .ab-frame[data-fontpair="playful"] .bs-h1 {
      font-style: italic;
      font-weight: 500;
    }

    .logo-gallery {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;
    }
    .logo-tile {
      border: 1px solid var(--line);
      border-radius: var(--r-3);
      background: var(--surface);
      padding: 24px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .logo-tile h4 {
      margin: 0; font-size: 12px; font-weight: 500;
      color: var(--fg-subtle); text-transform: uppercase; letter-spacing: 0.08em;
    }
    .logo-tile .preview {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--surface-2);
      border-radius: var(--r-2); min-height: 100px;
    }
    .logo-tile .preview.dark {
      background: oklch(0.18 0.01 70);
    }
    .logo-tile .preview.dark .bs-wordmark { color: oklch(0.95 0.005 70); }
    .logo-tile .desc { font-size: 13px; color: var(--fg-muted); line-height: 1.5; margin: 0; }

    /* Icon set comparison */
    .iconset-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;
    }
    .iconset {
      border: 1px solid var(--line);
      border-radius: var(--r-3);
      background: var(--surface);
      padding: 28px;
    }
    .iconset h4 {
      margin: 0 0 4px; font-size: 13px; font-weight: 600;
      letter-spacing: -0.005em; color: var(--fg);
    }
    .iconset .sub {
      font-size: 12.5px; color: var(--fg-muted);
      margin: 0 0 22px; line-height: 1.5;
    }
    .icon-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
    }
    .icon-cell {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 6px;
      border-radius: var(--r-2);
      background: var(--surface-2);
    }
    .icon-cell .lbl {
      font-family: var(--font-mono); font-size: 10.5px;
      color: var(--fg-subtle); letter-spacing: 0.02em;
    }
    .icon-context {
      margin-top: 22px; padding-top: 22px;
      border-top: 1px solid var(--line-soft);
      display: flex; flex-direction: column; gap: 12px;
    }
    .icon-context .ctx-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--surface-2);
      border-radius: var(--r-2);
      font-size: 13.5px;
      color: var(--fg);
    }
    .icon-context .ctx-card .meta { color: var(--fg-muted); font-size: 12.5px; }

    .egg-row {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    }
    .egg-tile {
      border: 1px solid var(--line);
      border-radius: var(--r-3);
      background: var(--surface);
      padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .egg-tile .label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--fg-subtle);
      letter-spacing: 0.04em;
    }
    .egg-tile .label b {
      font-weight: 600; color: var(--fg);
    }
    .egg-tile .stage {
      flex: 1;
      background: var(--surface-2);
      border-radius: var(--r-2);
      display: flex; align-items: center; justify-content: center;
      padding: 28px 12px;
      min-height: 180px;
      color: var(--fg);

    .egg-tile .small-row {
      display: flex; gap: 14px; align-items: center; justify-content: center;
      padding: 10px 0 4px;
      color: var(--fg-muted);
    }
    .egg-tile .small-row .cap {
      font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle);
    }
    .egg-tile p.note { font-size: 12.5px; color: var(--fg-muted); line-height: 1.45; margin: 0; }

        { title: 'Birthday brunch for Sam', description: 'Sunday vibes, low-key 💕', locations: [SAMPLE_LOCATIONS[0], SAMPLE_LOCATIONS[1]], times: [SAMPLE_TIMES[1], SAMPLE_TIMES[2]], invited: [] },
        { title: 'Birthday brunch for Sam', description: 'Sunday vibes, low-key 💕', locations: [SAMPLE_LOCATIONS[0]], times: [SAMPLE_TIMES[1]], invited: [SAMPLE_FRIENDS[0], SAMPLE_FRIENDS[1], SAMPLE_FRIENDS[2]] },
      ];
      const [data, setData] = React.useState(seeds[step]);
      React.useEffect(() => { setData(seeds[step]); }, [step]);

      const StepCmp = [Step1Title, Step2Where, Step3When, Step4Who][step];

      if (step === 4) {

          <div className="bs-app">

              <Wordmark size="md" />
              <button className="bs-btn ghost"><IconClose size={16} /> <span>Cancel</span></button>
            </header>
            <main className="bs-page" style={{ maxWidth: 720 }}>
              <SuccessScreen data={seeds[4]} onDone={() => {}} />

      }

      return (
        <div className="bs-app">

    const IconsGallery = ({ theme = 'light', fontpair = 'original', tablecloth = 'subtle' }) => {
      const stroke = [

        { Cmp: window.IconPin,      name: 'pin' },
        { Cmp: window.IconUsers,    name: 'users' },
        { Cmp: window.IconClock,    name: 'clock' },
        { Cmp: window.IconSparkle,  name: 'sparkle' },
        { Cmp: window.IconCheck,    name: 'check' },
        { Cmp: window.IconShare,    name: 'share' },
        { Cmp: window.IconPlus,     name: 'plus' },

      const pop = [
        { Cmp: window.PopCalendar, name: 'calendar', tone: 'butter' },
        { Cmp: window.PopPin,      name: 'pin',      tone: 'tomato' },
        { Cmp: window.PopUsers,    name: 'users',    tone: 'mint' },
        { Cmp: window.PopClock,    name: 'clock',    tone: 'peri' },

        { Cmp: window.PopCheck,    name: 'check',    tone: 'mint' },
        { Cmp: window.PopShare,    name: 'share',    tone: 'lavender' },
        { Cmp: window.PopPlus,     name: 'plus',     tone: 'butter' },

              Same silhouettes, so swapping is one-for-one.

                    <div className="icon-cell" key={name}>

              </div>

              <div className="iconset">
                <h4>Pop · used sparingly</h4>
                <p className="sub">Each carries a tuned hue from the brand palette — same chroma, different angle.</p>
                <div className="icon-row">
                  {pop.map(({ Cmp, name, tone }) => (
                    <div className="icon-cell" key={name}>
                      <Cmp size={28} />
                      <span className="lbl">{name} · {tone}</span>

                <div className="icon-context">
                  <div className="ctx-card">
                    <window.PopCalendar size={26} />

    };

    const LogoGallery = ({ theme = 'light', fontpair = 'original', tablecloth = 'subtle' }) => (
      <Themed theme={theme} fontpair={fontpair} tablecloth={tablecloth}>
        <div style={{ padding: '40px 48px' }}>
          <p className="bs-eyebrow">Egg shape — exploration</p>
          <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 32, fontWeight: 500, letterSpacing: '-0.02em', margin: '0 0 8px' }}>
            Making the egg read as an egg
          </h2>
          <p style={{ color: 'var(--fg-muted)', fontSize: 15, margin: '0 0 24px', maxWidth: 620 }}>
            A0 is the original — concentric circles read as a target as much as an egg.
            A1 → A3 progressively add the visual cues that say "fried egg": off-center yolk, ovoid white, irregular edge.
            A4 → A5 try a double-yolk that hints at a capital B.
          </p>

          <div className="egg-row" style={{ marginBottom: 20 }}>
            <div className="egg-tile">
              <div className="label"><b>A0</b> · circle + center yolk</div>
              <div className="stage"><LogoMarkA size={132} /></div>
              <div className="small-row">
                <LogoMarkA size={40} />
                <LogoMarkA size={20} />
                <span className="cap">40 / 20px</span>
              </div>
              <p className="note">Original. Geometrically clean but symmetric — reads bullseye first.</p>
            </div>

            <div className="egg-tile">
              <div className="label"><b>A1</b> · circle + off-center yolk</div>
              <div className="stage"><LogoMarkA1 size={132} /></div>
              <div className="small-row">
                <LogoMarkA1 size={40} />
                <LogoMarkA1 size={20} />
                <span className="cap">40 / 20px</span>
              </div>
              <p className="note">Cheapest fix. Asymmetry alone is enough — your eye stops reading target.</p>
            </div>

            <div className="egg-tile">
              <div className="label"><b>A2</b> · ovoid + off-center yolk</div>
              <div className="stage"><LogoMarkA2 size={132} /></div>
              <div className="small-row">
                <LogoMarkA2 size={40} />
                <LogoMarkA2 size={20} />
                <span className="cap">40 / 20px</span>
              </div>
              <p className="note">Still primitive (one ellipse), now unmistakably egg-shaped. My pick.</p>
            </div>

            <div className="egg-tile">
              <div className="label"><b>A3</b> · irregular blob</div>
              <div className="stage"><LogoMarkA3 size={132} /></div>
              <div className="small-row">
                <LogoMarkA3 size={40} />
                <LogoMarkA3 size={20} />
                <span className="cap">40 / 20px</span>
              </div>
              <p className="note">Most literal. Warmer, more illustrative — pulls the brand a touch away from minimal-utility.</p>
            </div>

          <div className="egg-row" style={{ marginBottom: 32 }}>

              <div className="label"><b>A4</b> · double yolk · equal</div>
              <div className="stage"><LogoMarkA4 size={132} /></div>
              <div className="small-row">
                <LogoMarkA4 size={40} />
                <LogoMarkA4 size={20} />
                <span className="cap">40 / 20px</span>
              </div>
              <p className="note">Two stacked yolks left-of-center — reads as a B's bumps. Risk: at small sizes they merge into a peanut.</p>
            </div>
            <div className="egg-tile">
              <div className="label"><b>A5</b> · double yolk · B-proportions</div>
              <div className="stage"><LogoMarkA5 size={132} /></div>
              <div className="small-row">
                <LogoMarkA5 size={40} />
                <LogoMarkA5 size={20} />
                <span className="cap">40 / 20px</span>
              </div>
              <p className="note">Lower yolk slightly larger (real B proportions). The asymmetry sells the letterform.</p>
            </div>
            <div className="egg-tile" style={{ visibility: 'hidden' }}></div>
            <div className="egg-tile" style={{ visibility: 'hidden' }}></div>

              <div className="preview"><Wordmark size="lg" mark="a" /></div>
              <div className="preview dark"><Wordmark size="lg" mark="a" /></div>
            </div>
            <div className="logo-tile">
              <h4>A1 · off-center yolk</h4>
              <div className="preview"><Wordmark size="lg" mark="a1" /></div>
              <div className="preview dark"><Wordmark size="lg" mark="a1" /></div>

            <div className="logo-tile">
              <h4>A2 · ovoid</h4>
              <div className="preview"><Wordmark size="lg" mark="a2" /></div>
              <div className="preview dark"><Wordmark size="lg" mark="a2" /></div>

            <div className="logo-tile">
              <h4>A3 · blob</h4>
              <div className="preview"><Wordmark size="lg" mark="a3" /></div>
              <div className="preview dark"><Wordmark size="lg" mark="a3" /></div>

              <div className="preview dark"><Wordmark size="lg" mark="a4" /></div>

            <div className="logo-tile">

              <div className="preview" style={{ padding: 32 }}><WordmarkOnly size="xl" /></div>
              <div className="preview dark" style={{ padding: 32 }}><WordmarkOnly size="xl" /></div>
              <p className="desc">No mark — Fraunces with a butter dot. Cleanest in tight chrome.</p>
            </div>
          </div>
        </div>

    );

    const InteractiveFlow = ({ theme = 'light', fontpair = 'original', tablecloth = 'subtle', startAt = 'dashboard' }) => {
      const [view, setView] = React.useState(startAt);
      const [creating, setCreating] = React.useState(false);

      if (creating) {
        return (
          <Themed theme={theme} fontpair={fontpair} tablecloth={tablecloth}>
            <CreateBrunchWizard
              onClose={() => setCreating(false)}
              onComplete={() => { setCreating(false); setView('dashboard'); }}
              theme={theme}
            />
          </Themed>
        );
      }

      return (
        <Themed theme={theme} fontpair={fontpair} tablecloth={tablecloth}>
          {view === 'signin' && <SignIn />}
          {view === 'dashboard' && (
            <Dashboard
              onCreate={() => setCreating(true)}
              onOpenBrunch={(b) => setView(b.role === 'host' ? 'host' : 'invitee')}
              theme={theme}
            />

          {view === 'host' && <HostDetail onBack={() => setView('dashboard')} theme={theme} />}
          {view === 'invitee' && <InviteeDetail onBack={() => setView('dashboard')} theme={theme} />}

      const [allowed, setAllowed] = React.useState(true);
      const [max, setMax] = React.useState(1);

          <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
            <window.MuteBrunchControl value={value} onChange={setValue} />

            <button onClick={() => setOpen(true)} className="bs-btn" style={{ position: 'absolute', top: 16, right: 16, zIndex: 200 }}>
              Replay tour
            </button>
          )}

    window.PhotoCropDemo = () => (
      <div style={{ padding: 0, position: 'relative', height: '100%', background: 'oklch(0.20 0.01 70 / 0.40)' }}>

            <div style={{ height: 4, background: 'var(--accent-strong)' }} />
            <div style={{ padding: '24px 24px 4px' }}>
              <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 22, fontWeight: 500, letterSpacing: '-0.015em', margin: '0 0 6px' }}>Update your photo</h2>
              <p style={{ color: 'var(--fg-muted)', fontSize: 14, margin: 0, lineHeight: 1.5 }}>Square works best — JPG or PNG, up to 5 MB.</p>
            </div>
            <div style={{ padding: '16px 24px' }}>
              <div className="bs-col" style={{ gap: 14, alignItems: 'center' }}>
                <div style={{ width: 200, height: 200, borderRadius: '50%', background: 'linear-gradient(135deg, var(--accent-soft) 0%, var(--accent) 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', boxShadow: 'inset 0 0 0 2px var(--accent-strong)' }}>
                  <span style={{ fontFamily: 'var(--font-display)', fontSize: 64, fontWeight: 500, color: 'var(--accent-fg)' }}>YO</span>
                  {[['top','left'], ['top','right'], ['bottom','left'], ['bottom','right']].map(([v, h], i) => (
                    <span key={i} style={{ position: 'absolute', [v]: -4, [h]: -4, width: 12, height: 12, borderRadius: 2, background: 'var(--surface)', border: '1.5px solid var(--accent-strong)' }} />
                  ))}
